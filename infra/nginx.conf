# copied to /etc/nginx/sites-available/default by create-webserver.sh
# test: sudo nginx -t
# logs: /var/log/nginx/access.log and error.log

# The 4 conditions to check
# curl -I http://hoverflylagoons.co.uk
# curl -I http://www.hoverflylagoons.co.uk
# curl -I https://hoverflylagoons.co.uk
# curl -I https://www.hoverflylagoons.co.uk

# anything not for our domain
server {
    listen   80 default_server;
    return   444;
}

# redirect http to https apex
server {
    listen        80;
    server_name   www.hoverflylagoons.co.uk hoverflylagoons.co.uk;
    return 301    https://hoverflylagoons.co.uk$request_uri;
}

# redirect https www to apex
server {
    listen        443 ssl;
    server_name   www.hoverflylagoons.co.uk;

    ssl_certificate     /etc/letsencrypt/live/hoverflylagoons.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoverflylagoons.co.uk/privkey.pem;

    return 301    https://hoverflylagoons.co.uk$request_uri;
}

# https://hoverflylagoons.co.uk - WordPress
server {
    listen 443 ssl;
    http2 on;
    server_name hoverflylagoons.co.uk;

    ssl_certificate     /etc/letsencrypt/live/hoverflylagoons.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoverflylagoons.co.uk/privkey.pem;

    root  /var/www/html;
    index index.php;

    # matches upload_max_filesize in php-hoverfly.ini
    client_max_body_size 64M;

    # nginx equivalent of the WordPress .htaccess rewrite rules
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # no .htaccess, .git etc
    location ~ /\. {
        deny all;
    }
}
